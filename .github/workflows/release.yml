name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  deck-installer-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test Steam Deck installer
        run: bash ./scripts/test-install-deck.sh

  release:
    needs: deck-installer-test
    runs-on: windows-2022

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version."
          }

      - name: Build, test and package
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\package-release.ps1
          -OutputDirectory artifacts
          -BuildDirectory build-release

      - name: Preserve build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deathtrap-native-50-${{ github.ref_name }}
          path: |
            artifacts/*.zip
            artifacts/*-SHA256.txt
          if-no-files-found: error

  release-package-test:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download the Windows-built release ZIP
        uses: actions/download-artifact@v4
        with:
          name: deathtrap-native-50-${{ github.ref_name }}
          path: artifacts

      - name: Install Ark-compatible archive extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Test actual ZIP extraction and Steam Deck installation
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          cd artifacts
          sha256sum -c "Deathtrap-Native-50-$version-SHA256.txt"
          cd ..
          bash ./scripts/test-install-deck.sh "artifacts/Deathtrap-Native-50-$version.zip"

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-package-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: deathtrap-native-50-${{ github.ref_name }}
          path: artifacts

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $assets = @(Get-ChildItem -LiteralPath artifacts -File |
            Where-Object { $_.Extension -eq '.zip' -or $_.Name.EndsWith('-SHA256.txt') } |
            ForEach-Object { $_.FullName })
          if ($assets.Count -ne 2) {
            throw "Expected ZIP and checksum assets; found $($assets.Count)."
          }
          $releasePreamble = Get-Content -LiteralPath `
            .github/release-preamble.md -Raw
          & gh release create $env:GITHUB_REF_NAME @assets `
            --draft --verify-tag `
            --title "Deathtrap Native 50 $env:GITHUB_REF_NAME" `
            --notes $releasePreamble `
            --generate-notes
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub release creation failed.'
          }
