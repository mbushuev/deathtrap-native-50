[NativeRender]
Enabled=1
Subframes=3

[Audio]
# The Steam build's legacy MSS wrapper reports 9 tracks and always reuses the
# last metadata-query index. Expose all CD tracks and route 2..16 to the
# shipped Sounds/0.mp3..Sounds/14.mp3 files. Unknown MSS wrappers are left
# untouched even when this option is enabled.
FixMusicTracks=1

[WeaponWheel]
Enabled=1
Invert=0

[XInput]
Enabled=1
Controller=0
BaseBindings=1
SelectorHoldMs=225
LeftStickDeadzone=7849
RightStickDeadzone=8689
TriggerThreshold=30
RightStickPixelsPerTick=12
MenuRightStickPixelsPerTick=6
RightStickResponseCurvePercent=135
# Keep the complete circular right-stick vector. A proportional cardinal-axis
# lock made diagonal orbit feel sticky and is now disabled by default.
RightStickAxisLockPercent=0
# Third-person right-stick orbit is 40 percent faster than the accepted
# immersive head view. This affects neither physical mouse sensitivity nor
# first-person controller look.
ThirdPersonOrbitSpeedPercent=140
InvertRightY=0
SelectorRadius=104
SelectorCenterY=316
MovementThresholdPercent=14
RunThresholdPercent=50
RunReleaseThresholdPercent=30
# XInput movement enters through the retail DirectInput joystick/action path.
# Native joystick Y owns forward motion. Camera-relative heading is applied at
# the common ground-state dispatcher through the engine's own heading writer;
# the state-dependent native horizontal axis remains neutral.
CameraRelativeMovement=1
# The verified Deathtrap input bridge reports physical up with the opposite
# sign from the camera-space movement basis. Keep this enabled by default.
CameraRelativeInvertY=1
# Maximum camera-relative course correction per original game tick. At the
# game's ~16.7 Hz simulation rate, 30 degrees gives a ~0.36 s half-turn while
# still using the engine's bounded heading writer rather than snapping.
MovementTurnDegreesPerTick=30
VibrationEnabled=1
VibrationStrengthPercent=100
MeleeSwingVibrationMs=170
BlockVibrationMs=60
SuccessfulBlockVibrationMs=210
SpellCastVibrationMs=260
RangedShotVibrationMs=115
HealingVibrationMs=320
SelectorTickVibrationMs=38
LandingVibrationMs=145
HeavyDamageVibrationMs=380
HeavyDamageThresholdHp=12
HitVibrationMs=150
DamageVibrationMs=240
DeathVibrationMs=700

[Camera]
# Persistent native third-person orbit. It becomes the sole gameplay camera
# as soon as a valid player/camera context exists. Mouse and right-stick look
# share the same rig; inventory selection suppresses look input without
# switching camera modes. R3 toggles retail first person; SELECT toggles the
# separate immersive first-person view configured below.
ThirdPersonOrbit=1
# Independent overlay-owned first-person view. F10 or gamepad SELECT toggles
# it without replacing the retail Tab/R3 mode. It keeps normal gameplay,
# renders the complete character/weapon model and collision-checks the eye
# endpoint through the same room and scene geometry as the modern camera.
ImmersiveFirstPerson=1
# Immersive W/S+A/D and the complete left-stick vector share the ordinary
# native walking/running root-motion path. Retail J/K and LB remain unchanged.
HorizontalDegreesPerTick=5
VerticalDegreesPerTick=3
# Physical DirectInput mouse sensitivity in thousandths of a degree per
# relative pixel. Mouse motion is unfiltered and consumed once per game tick;
# the native 50 Hz renderer interpolates the accepted camera endpoints.
MouseHorizontalMilliDegreesPerPixel=180
MouseVerticalMilliDegreesPerPixel=150
ResponseTimeMs=50
MinimumPitchDegrees=-35
MaximumPitchDegrees=55
HeadMinimumPitchDegrees=-75
HeadMaximumPitchDegrees=75
# Offsets from the structurally resolved animated head centre. Rotation stays
# user-owned, so animation supplies body attachment without forced head bob.
HeadHeight=10
HeadForwardOffset=55
MinimumRadius=650
MaximumRadius=1800
# Default distance of the unobstructed spring arm. The retail camera is used
# only to seed orientation; its often very short distance is not inherited.
PreferredRadius=1400
InvertX=0
InvertY=0

[Text]
MessageLifetimePercent=300

[Save]
# Keep the retail save/load format and official save points. Away from a
# save-point, saving is additionally allowed only after the living player has
# remained in the native grounded movement state on a stable surface.
SafeAnywhere=1

[Diagnostics]
# A compact support log is always created automatically. This switch adds the
# much larger development telemetry and should remain off unless requested.
DebugLog=0
# Heavy reverse-engineering streams. Keep off for normal per-launch logs;
# enable individually only for a requested diagnostic capture.
CameraProbe=0
HeadJointProbe=0
# Read-only native sector/object collision-resource comparison. It samples the
# modern camera arm every five source ticks and writes bounded records to the
# per-launch log without changing the accepted camera pose.
NativeCollisionProbe=0
