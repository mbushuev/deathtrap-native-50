[Camera]
# Persistent native third-person orbit. It becomes the sole gameplay camera
# as soon as a valid player/camera context exists. Mouse and right-stick look
# share the same rig; inventory selection suppresses look input without
# switching camera modes. R3 and SELECT do not change the gameplay camera.
