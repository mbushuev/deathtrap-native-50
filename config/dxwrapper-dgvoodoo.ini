;; Deathtrap Dungeon widescreen presentation layer.
;;
;; The Deathtrap-specific Dd7to9 build keeps the game's logical 800x600 mode,
;; allocates an aspect-correct supersampled render target, expands only the active
;; 3D world pass and maps all other pre-transformed draws into the centered
;; 4:3 safe area.  Its D3D9 output is handed to the bundled dgVoodoo runtime,
;; which remains the final D3D11 backend.

[General]
RealDllPath = AUTO
WrapperMode = AUTO
DisableLogging = 1

[Plugins]
LoadPlugins = 0

[Compatibility]
Dd7to9 = 1
D3d8to9 = 0
D3d9to9Ex = 0
D3d9on12 = 0
DDrawCompat = 0
Dinputto8 = 0
EnableDdrawWrapper = 0
EnableD3d9Wrapper = 0

[Dd7to9]
DdrawAutoFrameSkip = 0
DdrawAutoEndSceneOnFlip = 1
DdrawClearFlipBackBuffer = 1
DdrawAllowPrimarySurfaceReplacement = 1
DdrawKeepAllInterfaceCache = 0
DdrawDisableAlphaTestForAdditiveColorKey = 1
DdrawUseTextureAlphaForUnblendedColorKey = 1
DdrawUseExternalD3D9 = 1
DdrawDumpTextures = 0
; a807a5e enables the verified world/HUD mapping only when scale is 2..4.
; At 16:10 scale 3 creates a 2880x1800 target; other aspects use the same height.
DdrawInternalResolutionScale = 3
DdrawWidescreenAspectX1000 = 1
DdrawTraceAlphaDraws = 0
DdrawCreateDeviceEarly = 0
DdrawRemoveScanlines = 0
DdrawRemoveInterlacing = 0
DdrawIntroVideoFix = 0
DdrawUseNativeResolution = 1
DdrawOverrideWidth = 0
DdrawOverrideHeight = 0
DdrawMaintainAspectRatio = 1

[d3d9]
EnableVSync = 0
ForceVsyncMode = 1
LimitPerFrameFPS = 0
ShowFPSCounter = 0
FlipEx = 0
EnableWindowMode = 1
WindowModeBorder = 0
FullscreenWindowMode = 1
